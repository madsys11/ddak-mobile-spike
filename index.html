<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2328">
<title>ddak 실험</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --card: #f6f8fa; --ok: #1a7f37; --bad: #cf222e; --accent: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --card: #161b22; --ok: #3fb950; --bad: #f85149; --accent: #4493f8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px 40px; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 4px 0 12px; }
  h2 { font-size: 15px; margin: 18px 0 8px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  input { width: 100%; padding: 9px 10px; margin: 4px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
  button { padding: 8px 12px; margin: 4px 4px 0 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .muted { color: var(--muted); font-size: 13px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .comp { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  .comp:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  #log { white-space: pre-wrap; word-break: break-all; font: 12px/1.4 ui-monospace, monospace; max-height: 50vh; overflow: auto; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; word-break: break-all; }
</style>
</head>
<body>
<h1>ddak 모바일 실험 (M0)</h1>

<section>
  <h2 style="margin-top:0">상태</h2>
  <dl id="env"></dl>
  <button id="refreshEnv">새로 고침</button>
</section>

<section>
  <h2 style="margin-top:0">컴퓨터 추가</h2>
  <input id="addUrl" type="url" placeholder="https://이름.tailnet.ts.net" autocomplete="off" autocapitalize="off">
  <input id="addCode" inputmode="numeric" placeholder="페어링 코드 6자리" autocomplete="off">
  <button class="primary" id="addBtn">페어링</button>
</section>

<section>
  <h2 style="margin-top:0">컴퓨터</h2>
  <div id="comps"><span class="muted">아직 없음</span></div>
</section>

<section>
  <h2 style="margin-top:0">알림 키</h2>
  <dl id="pushInfo"></dl>
  <button id="notifBtn">알림 권한 요청</button>
  <button class="primary" id="subBtn">키 만들고 구독 → 모든 컴퓨터에 전달</button>
  <button id="rotateBtn">알림 키 바꾸기</button>
</section>

<section>
  <h2 style="margin-top:0">기록 <button id="copyLog">복사</button> <button id="clearLog">지우기</button></h2>
  <div id="log"></div>
</section>

<script src="app.js"></script>
</body>
</html>
